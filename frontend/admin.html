<!DOCTYPE html>
<html lang="pt-BR" class="font-1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Professor</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Painel do Professor</h1>

    <div class="card">
      <h2>Nova prova</h2>
      <input type="text" id="exam-title" placeholder="Título da prova" />
      <br /><br />
      <textarea id="exam-desc" placeholder="Descrição" rows="3"></textarea>
      <br /><br />
      <input type="text" id="exam-duration" placeholder="Duração (minutos)" value="60" />
      <br /><br />
      <button onclick="createExam()">Criar prova</button>
    </div>

    <div class="card">
      <h2>Minhas provas</h2>
      <div id="exams-list"></div>
    </div>

    <div class="card">
      <h2>Adicionar questão</h2>
      <input type="text" id="q-exam-id" placeholder="ID da prova" />
      <br /><br />
      <textarea id="q-statement" placeholder="Enunciado" rows="3"></textarea>
      <br /><br />
      <select id="q-kind">
        <option value="multiple_choice">Múltipla escolha</option>
        <option value="essay">Dissertativa</option>
      </select>
      <br /><br />
      <input type="text" id="q-options" placeholder="Alternativas separadas por | (ex.: A|B|C|D|E)" />
      <br /><br />
      <input type="text" id="q-correct" placeholder="Alternativa correta (ex.: B)" />
      <br /><br />
      <button onclick="addQuestion()">Adicionar questão</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("exam_token");
    if (!token) window.location.href = "/index.html";

    async function apiFetch(url, options = {}) {
      options.headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
      };
      return fetch(url, options);
    }

    async function loadExams() {
      const exams = await (await apiFetch("/exams")).json();
      document.getElementById("exams-list").innerHTML = exams
        .map(
          (e) => `<p>#${e.id} — ${e.title} ${e.is_published ? "✅ publicada" : "📝 rascunho"}
          ${!e.is_published ? `<button class="secondary" onclick="publishExam(${e.id})">Publicar</button>` : ""}</p>`
        )
        .join("");
    }

    async function createExam() {
      const title = document.getElementById("exam-title").value;
      const description = document.getElementById("exam-desc").value;
      const duration_minutes = parseInt(document.getElementById("exam-duration").value, 10) || 60;
      await apiFetch("/exams", {
        method: "POST",
        body: JSON.stringify({ title, description, duration_minutes }),
      });
      loadExams();
    }

    async function publishExam(id) {
      await apiFetch(`/exams/${id}/publish`, { method: "POST" });
      loadExams();
    }

    async function addQuestion() {
      const examId = document.getElementById("q-exam-id").value;
      const statement = document.getElementById("q-statement").value;
      const kind = document.getElementById("q-kind").value;
      const options = document.getElementById("q-options").value || null;
      const correct_option = document.getElementById("q-correct").value || null;
      await apiFetch(`/exams/${examId}/questions`, {
        method: "POST",
        body: JSON.stringify({ statement, kind, options, correct_option }),
      });
      alert("Questão adicionada!");
    }

    loadExams();
  </script>
</body>
</html>
